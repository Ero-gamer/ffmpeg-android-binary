name: Build FFmpeg Android (armeabi-v7a)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up NDK
        uses: nsetup/setup-ndk@v3
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Make script executable
        run: chmod +x ./build_ffmpeg.sh

      - name: Execute FFmpeg build script
        run: ./build_ffmpeg.sh

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-armeabi-v7a-shared
          path: android/project_output/armeabi-v7a/
